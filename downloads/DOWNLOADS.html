<!DOCTYPE html>

    <style>
        body {
            font-family: 'Rajdhani', Arial, sans-serif;
            background-color: #0d0f12;
            color: #ffffff;
            margin: 0;
            padding: 0;
            font-size: 19px;
            letter-spacing: 0.5px;
        }
        header {
            background-color: #05070a;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid #00bcd4;
            box-shadow: 0 4px 20px rgba(0, 188, 212, 0.1);
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .logo span {
            color: #00bcd4;
            text-shadow: 0 0 10px rgba(0, 188, 212, 0.6);
        }
        nav a {
            font-family: 'Orbitron', sans-serif;
            color: #cccccc;
            text-decoration: none;
            font-size: 16px;
            margin: 0 20px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: color 0.3s, text-shadow 0.3s;
        }
        nav a:hover {
            color: #00bcd4;
            text-shadow: 0 0 8px rgba(0, 188, 212, 0.6);
        }
        main {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        h1, h2 {
            font-family: 'Orbitron', sans-serif;
            color: #00bcd4;
            text-transform: uppercase;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 30px;
        }
        h2 {
            margin-top: 50px;
            font-size: 22px;
            letter-spacing: 1px;
        }
        .download-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px auto;
        }
        .btn-download {
            background-color: #00bcd4;
            color: #05070a;
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
            line-height: 1.4;
            box-shadow: 0 4px 15px rgba(0, 188, 212, 0.2);
        }
        .btn-download:hover {
            background-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
        }
        .btn-external {
            background-color: #28a745;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.2);
        }
        .btn-external:hover {
            background-color: #34ce57;
            box-shadow: 0 6px 20px rgba(52, 206, 87, 0.3);
        }
        .instruction-block {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
        }
        .instruction-block .btn-download {
            width: 100%;
            box-sizing: border-box;
        }
        .link-instruction {
            display: inline-block;
            color: #ffc107;
            text-decoration: underline;
            font-size: 15px;
            font-weight: 600;
            transition: color 0.3s;
        }
        .link-instruction:hover {
            color: #ffffff;
        }
    </style>
</head>
